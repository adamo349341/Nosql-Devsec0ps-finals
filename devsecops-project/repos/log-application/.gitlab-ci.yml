stages:
  - build
  - push
  - terraform
  - deploy

variables:
  AWS_REGION: "us-east-1"                        # replace
  ECR_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
  IMAGE_NAME: "logviewer"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  TF_DIR: "iac"

# ── Build Docker image ───────────────────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
  script:
    - cd app
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker save $IMAGE_NAME:$IMAGE_TAG | gzip > /tmp/image.tar.gz
  artifacts:
    paths:
      - /tmp/image.tar.gz
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Push to ECR ──────────────────────────────────────────────
push:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker load < /tmp/image.tar.gz
    - docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
    - docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker push $ECR_REGISTRY/$IMAGE_NAME:latest
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Terraform Plan (on MR) ───────────────────────────────────
terraform:plan:
  stage: terraform
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  before_script:
    - cd $TF_DIR
    - terraform init
  script:
    - terraform plan -var="image_tag=$IMAGE_TAG" -out=tfplan
  artifacts:
    paths:
      - $TF_DIR/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── Terraform Apply (main only) ──────────────────────────────
terraform:apply:
  stage: terraform
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  before_script:
    - cd $TF_DIR
    - terraform init
  script:
    - terraform apply -var="image_tag=$IMAGE_TAG" -auto-approve
  dependencies:
    - terraform:plan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: manual   # remove this line to make it fully automatic

# ── Deploy k8s manifests ─────────────────────────────────────
deploy:k8s:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  before_script:
    # KUBECONFIG must be set as a GitLab CI variable (base64 encoded)
    - echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - kubectl apply -f k8s/
    - kubectl set image deployment/logviewer logviewer=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG -n logviewer
    - kubectl rollout status deployment/logviewer -n logviewer
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - push
    - terraform:apply