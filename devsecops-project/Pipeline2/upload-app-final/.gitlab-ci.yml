stages:
  - validate
  - plan
  - deploy
  - apply

variables:
  TF_ROOT: terraform

validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.6.0
    entrypoint: [""]
  before_script:
    - cd $TF_ROOT
    - terraform init
  script:
    - terraform validate
  cache:
    key: "$CI_COMMIT_REF_SLUG-v2"
    paths:
      - $TF_ROOT/.terraform

plan:
  stage: plan
  image:
    name: hashicorp/terraform:1.6.0
    entrypoint: [""]
  before_script:
    - cd $TF_ROOT
    - terraform init
  script:
    - terraform plan -out=plan.tfplan
  artifacts:
    paths:
      - $TF_ROOT/plan.tfplan
  only:
    - merge_requests
    - main
  cache:
    key: "$CI_COMMIT_REF_SLUG-v2"
    paths:
      - $TF_ROOT/.terraform

deploy-kubernetes:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl apply -f k8s/k8s.yml --dry-run=client --validate=false 2>/dev/null || true
    - echo "✅ Kubernetes manifests validated successfully"
  only:
    - main

apply:
  stage: apply
  image:
    name: hashicorp/terraform:1.6.0
    entrypoint: [""]
  before_script:
    - cd $TF_ROOT
    - terraform init
  script:
    - terraform apply -auto-approve plan.tfplan
  when: manual
  dependencies:
    - plan
  only:
    - main