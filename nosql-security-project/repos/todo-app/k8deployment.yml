# ================================================
# Kubernetes Deployment - MarkSync (todo-app)
# ================================================
# Commande pour deployer :
#   kubectl apply -f k8s-deployment.yml
# Commande pour supprimer :
#   kubectl delete -f k8s-deployment.yml
# ================================================

# --- 1. Namespace ---
apiVersion: v1
kind: Namespace
metadata:
  name: todo-app

---
# --- 2. Deployment (2 replicas de l'app) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: todo-app
  labels:
    app: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: todo-app
          image: registry.gitlab.com/adammentagui8/todo-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
# --- 3. Service (expose l'app sur port 80) ---
apiVersion: v1
kind: Service
metadata:
  name: todo-app-service
  namespace: todo-app
spec:
  selector:
    app: todo-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer