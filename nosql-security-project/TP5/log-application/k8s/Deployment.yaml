apiVersion: apps/v1
kind: Deployment
metadata:
  name: logviewer
  namespace: logviewer
  labels:
    app: logviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logviewer
  template:
    metadata:
      labels:
        app: logviewer
    spec:
      containers:
        - name: logviewer
          image: logviewer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: logviewer-config
                  key: PORT
            - name: LOG_DIR
              valueFrom:
                configMapKeyRef:
                  name: logviewer-config
                  key: LOG_DIR
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
          volumeMounts:
            - name: logs-volume
              mountPath: /app/logs
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/stats
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: logs-volume
          hostPath:
            path: /tmp/logs
            type: DirectoryOrCreate